name: Release

# Push a tag like v1.0.0 to build the extension and publish a GitHub release
# with the zip that is uploaded to the Chrome Web Store.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check that the tag matches the manifest version
        run: |
          version=$(node -p "require('./public/manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm test
      - run: npm run build

      - name: Package
        run: |
          cd dist
          zip -r -X "../export-for-claude-${VERSION}.zip" .

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" "export-for-claude-${VERSION}.zip" \
            --title "Export for Claude ${VERSION}" \
            --generate-notes
